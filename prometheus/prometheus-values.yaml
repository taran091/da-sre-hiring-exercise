server:
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - localhost
    paths:
      - /
  service:
    type: ClusterIP

  extraScrapeConfigs: |
    - job_name: 'currency-converter'
      static_configs:
        - targets: ['currency-converter.currency-converter.svc.cluster.local:8080']