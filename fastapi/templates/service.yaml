apiVersion: v1
kind: Service
metadata:
  name: currency-conversion-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: currency-conversion
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
